name: Apple Tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test:
    name: Swift ${{ matrix.swift }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Swift 6.3
          - swift: "6.3"
            os: macos-26

          # Swift 6.2
          - swift: "6.2"
            os: macos-26
          - swift: "6.2"
            os: macos-15

          # Swift 6.1
          - swift: "6.1"
            os: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@v1.14.2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

  example:
    name: Swift 6 Example App / macOS 26
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Build example app
        run: >-
          xcodebuild
          -project Examples/SequentialExecutorExample.xcodeproj
          -scheme SequentialExecutorExample
          -configuration Debug
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build

  documentation:
    name: DocC / macOS 26
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build documentation
        run: >-
          xcodebuild docbuild
          -scheme SequentialExecutor
          -destination 'generic/platform=macOS'
          OTHER_DOCC_FLAGS='--warnings-as-errors'

  platforms:
    name: ${{ matrix.name }} / macOS 26
    runs-on: macos-26

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Simulator tests
            action: test
            destination: platform=iOS Simulator,name=iPhone 17
          - name: tvOS build
            action: build
            destination: generic/platform=tvOS
          - name: watchOS build
            action: build
            destination: generic/platform=watchOS
          - name: visionOS build
            action: build
            destination: generic/platform=visionOS

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: ${{ matrix.name }}
        run: >-
          xcodebuild ${{ matrix.action }}
          -scheme SequentialExecutor
          -destination '${{ matrix.destination }}'
          CODE_SIGNING_ALLOWED=NO
